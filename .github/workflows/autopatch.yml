name: Auto Patch Instafel (Local Mode)

on:
  schedule:
    # 毎日 日本時間 午前4時 / 午後4時 (UTC 19:00 / 07:00) にチェック
    - cron: '0 7,19 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

jobs:
  check-and-patch:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Javaのセットアップ
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Android SDKのセットアップ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platform-tools"

      # 4. 更新チェック (Instafel公式API経由)
      #    upstreamの GitHub Releases からAPK配布が撤去されたため、
      #    公式サイト https://instafel.mamii.dev が使っている公開JSON APIを叩く。
      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: "https://api.mamii.dev"
          CDN_BASE: "https://cdn.mamii.dev/instafel/releases"
        run: |
          set -euo pipefail

          # --- リリース一覧を取得 ---
          # releases[] は新しい順の配列で、要素は
          # [iflVersion, iflGenID, igVersion, releaseDate, isDeleted, changelogs, patcherVersion]
          echo "Fetching release list from $API_BASE ..."
          LIST=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            "$API_BASE/content/rels/list?page=1")

          # 削除済み (isDeleted == true) はCDNから実ファイルが消えているので除外し、
          # 生き残っている中で最新のものを選ぶ
          LATEST=$(echo "$LIST" | jq -c '[.releases[] | select(.[4] == false)][0]')

          if [ -z "$LATEST" ] || [ "$LATEST" == "null" ]; then
            echo "Error: No available (non-deleted) release found in API response."
            exit 1
          fi

          IFL_VER=$(echo "$LATEST" | jq -r '.[0]')
          IG_VER=$(echo "$LATEST" | jq -r '.[2]')
          PATCHER_VER=$(echo "$LATEST" | jq -r '.[6]')
          TAG_NAME="v${IFL_VER}"

          echo "Upstream version: $TAG_NAME (Instagram $IG_VER, patcher $PATCHER_VER)"

          # --- 自分のリポジトリの最新リリースを取得 ---
          CURRENT_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          echo "Current local version: ${CURRENT_TAG:-(none)}"

          # タグ 'vNNN' から数値部分だけ取り出す (取れなければ 0 扱い)
          CURRENT_NUM=$(echo "${CURRENT_TAG#v}" | grep -oE '^[0-9]+' || echo "0")
          CURRENT_NUM=${CURRENT_NUM:-0}

          if [ "$IFL_VER" -le "$CURRENT_NUM" ]; then
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 念のためタグの実在チェック。
          # (リリースを消した直後などに gh release create がタグ重複で落ちるのを防ぐ)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping."
            echo "update_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- リリース詳細からファイル名とハッシュを取得 ---
          echo "Fetching release details for $TAG_NAME ..."
          DETAIL=$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            "$API_BASE/content/rels/get/${IFL_VER}")

          # Clone版 ('instafel_c_') を使う。非Clone版は fileInfos.unclone。
          FILE_NAME=$(echo "$DETAIL" | jq -r '.fileInfos.clone.fileName // empty')
          FILE_HASH=$(echo "$DETAIL" | jq -r '.fileInfos.clone.fileHash // empty')

          if [ -z "$FILE_NAME" ] || [ -z "$FILE_HASH" ]; then
            echo "Error: Clone build info not found for $TAG_NAME."
            echo "$DETAIL"
            exit 1
          fi

          DOWNLOAD_URL="${CDN_BASE}/v${IFL_VER}/${FILE_NAME}"

          echo "New version found!"
          echo "  file: $FILE_NAME"
          echo "  md5 : $FILE_HASH"
          echo "  url : $DOWNLOAD_URL"

          {
            echo "update_needed=true"
            echo "tag_name=$TAG_NAME"
            echo "ifl_version=$IFL_VER"
            echo "ig_version=$IG_VER"
            echo "patcher_version=$PATCHER_VER"
            echo "file_name=$FILE_NAME"
            echo "file_hash=$FILE_HASH"
            echo "download_url=$DOWNLOAD_URL"
          } >> $GITHUB_OUTPUT

      # 5. Instafel APKのダウンロード (公式CDNから)
      - name: Download Instafel APK
        if: steps.check.outputs.update_needed == 'true'
        env:
          DOWNLOAD_URL: ${{ steps.check.outputs.download_url }}
          FILE_NAME: ${{ steps.check.outputs.file_name }}
          FILE_HASH: ${{ steps.check.outputs.file_hash }}
        run: |
          set -euo pipefail

          echo "Downloading $FILE_NAME ..."
          curl -fL -sS --retry 5 --retry-delay 10 --retry-all-errors \
            -o instafel.apk "$DOWNLOAD_URL"

          ls -lh instafel.apk

          # APIが返すMD5と照合する
          ACTUAL_HASH=$(md5sum instafel.apk | cut -d' ' -f1)
          echo "expected md5: $FILE_HASH"
          echo "actual   md5: $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$FILE_HASH" ]; then
            echo "Error: MD5 mismatch. Aborting."
            exit 1
          fi

          echo "MD5 verified."

      # 6. LSPatch (JingMatrix版) のダウンロード
      - name: Download LSPatch (JingMatrix)
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LSPATCH_REPO: "JingMatrix/LSPatch"
        run: |
          echo "Downloading latest LSPatch resources from $LSPATCH_REPO..."
          LATEST_LSPATCH_TAG=$(gh release list --repo "$LSPATCH_REPO" --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$LATEST_LSPATCH_TAG" ]; then
            echo "Error: Could not find LSPatch release."
            exit 1
          fi

          echo "LSPatch version: $LATEST_LSPATCH_TAG"

          # --- .jar ダウンロード ---
          # 複数ヒットに備えて1ファイルだけ選択してダウンロード
          JAR_FILE=$(gh release view "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --json assets \
            --jq '.assets[].name | select(endswith(".jar"))' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Error: No .jar asset found in LSPatch release."
            exit 1
          fi

          echo "Selected jar: $JAR_FILE"
          gh release download "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --pattern "$JAR_FILE" --output "lspatch.jar" --clobber

          # --- Manager APK ダウンロード ---
          # .apk が複数ある場合に備え、"manager" を含むファイルを優先して1つだけ選択
          APK_LIST=$(gh release view "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --json assets \
            --jq '.assets[].name | select(endswith(".apk"))')

          MANAGER_FILE=$(echo "$APK_LIST" | grep -i "manager" | head -n 1)

          if [ -z "$MANAGER_FILE" ]; then
            echo "Warning: 'manager' apk not found by name, falling back to first .apk"
            MANAGER_FILE=$(echo "$APK_LIST" | head -n 1)
          fi

          if [ -z "$MANAGER_FILE" ]; then
            echo "Error: No .apk asset found in LSPatch release."
            exit 1
          fi

          echo "Selected manager apk: $MANAGER_FILE"
          gh release download "$LATEST_LSPATCH_TAG" --repo "$LSPATCH_REPO" --pattern "$MANAGER_FILE" --output "manager.apk" --clobber

          ls -lh lspatch.jar manager.apk

      # 7. パッチ適用 (Local Mode + 注入ローダーデックス)
      - name: Apply LSPatch (Local Mode)
        if: steps.check.outputs.update_needed == 'true'
        run: |
          mkdir -p output

          echo "Applying patch in Local Mode with Inject Loader Dex..."
          java -jar lspatch.jar instafel.apk --manager manager.apk --injectdex -f -o output

          echo "Files in output directory:"
          ls -lh output/

          # Instafelのパッチ済みファイルのみを特定してリネーム
          mv output/instafel-*-lspatched.apk output/instafel-patched-unsigned.apk

      # 8. 署名 (apksignerを直接使用)
      - name: Sign APK (Manual)
        if: steps.check.outputs.update_needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS_VERSION: "34.0.0"
        run: |
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          echo "Running zipalign..."
          "$BUILD_TOOLS_PATH/zipalign" -v -p 4 output/instafel-patched-unsigned.apk output/instafel-aligned.apk

          echo "Running apksigner..."
          "$BUILD_TOOLS_PATH/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out output/instafel-patched.apk \
            output/instafel-aligned.apk

          rm release.keystore

      # 9. リリース作成
      - name: Create Release
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.check.outputs.tag_name }}
          IG_VERSION: ${{ steps.check.outputs.ig_version }}
          PATCHER_VERSION: ${{ steps.check.outputs.patcher_version }}
        run: |
          set -euo pipefail

          gh release create "$TAG_NAME" \
            output/instafel-patched.apk \
            --title "Instafel Patched $TAG_NAME" \
            --notes "Base: Instafel Clone (c) $TAG_NAME (Instagram $IG_VERSION)<br>Source: https://instafel.mamii.dev<br>Patcher: $PATCHER_VERSION<br>LSPatch: JingMatrix (Local Mode + Inject Dex)"
